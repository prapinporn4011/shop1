<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ShadowSport - Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; padding: 20px; }
        .admin-card { background: white; padding: 25px; border-radius: 12px; max-width: 900px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .order-row { border-bottom: 1px solid #eee; padding: 15px 0; display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px; }
        input { padding: 10px; margin: 5px 0; width: 200px; }
        button { cursor: pointer; padding: 8px 15px; border-radius: 5px; border: none; background: #00247d; color: white; }
        .status-tag { padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <div id="admin-auth" class="admin-card" style="text-align:center; max-width:400px;">
        <h2>🔐 ผู้ดูแลระบบ</h2>
        <input type="text" id="adm-u" placeholder="Admin Username"><br>
        <input type="password" id="adm-p" placeholder="Admin Password"><br>
        <button onclick="adminLogin()">เข้าสู่ระบบ</button>
        <p style="font-size:12px;">(หรือสมัครแอดมินใหม่โดยการกรอกข้อมูลแล้วกดปุ่มด้านล่าง)</p>
        <button onclick="adminReg()" style="background:#28a745;">สมัครแอดมิน</button>
    </div>

    <div id="admin-main" class="admin-card" style="display:none;">
        <div style="display:flex; justify-content:space-between;">
            <h1>📋 รายการสั่งซื้อทั้งหมด</h1>
            <button onclick="location.reload()" style="background:red;">Logout</button>
        </div>
        <hr>
        <div class="order-row" style="font-weight:bold; background:#f8f9fa;">
            <div>วันที่/ลูกค้า</div>
            <div>รายการ/ที่อยู่</div>
            <div>ยอดรวม</div>
            <div>สถานะ</div>
        </div>
        <div id="admin-order-list"></div>
    </div>

    <script>
        function adminReg() {
            const u = document.getElementById('adm-u').value;
            const p = document.getElementById('adm-p').value;
            localStorage.setItem('admin_user_' + u, p);
            alert('เพิ่มแอดมินแล้ว!');
        }

        function adminLogin() {
            const u = document.getElementById('adm-u').value;
            const p = document.getElementById('adm-p').value;
            if(localStorage.getItem('admin_user_' + u) === p || (u==='admin' && p==='1234')) {
                document.getElementById('admin-auth').style.display = 'none';
                document.getElementById('admin-main').style.display = 'block';
                renderAdminOrders();
            } else { alert('สิทธิ์เข้าถึงไม่ถูกต้อง'); }
        }

        function renderAdminOrders() {
            const orders = JSON.parse(localStorage.getItem('all_orders')) || [];
            const list = document.getElementById('admin-order-list');
            list.innerHTML = orders.map(o => `
                <div class="order-row">
                    <div>${o.date}<br><strong>👤 ${o.user}</strong></div>
                    <div>${o.items}<br><small>📍 ${o.addr}</small></div>
                    <div style="color:red;">${o.total} บาท</div>
                    <div><span class="status-tag">${o.status}</span></div>
                </div>
            `).reverse().join('');
        }
    </script>
</body>
</html>
