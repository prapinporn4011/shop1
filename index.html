<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThanJaiSport - Store</title>
    <style>
        :root { --blue: #00247d; --red: #ed1c24; --green: #28a745; }
        body { font-family: 'Sarabun', Arial, sans-serif; margin: 0; background: #f4f7f6; }
        .navbar { background: var(--blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* สไตล์หน้า Login/Reg */
        .auth-card { max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* สไตล์สินค้า */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #eee; padding: 15px; border-radius: 12px; text-align: center; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        
        /* ตะกร้าและประวัติ */
        .order-item { border-left: 5px solid var(--green); background: #f9f9f9; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; padding: 12px 20px; transition: 0.3s; }
        .btn-primary { background: var(--blue); color: white; width: 100%; }
        .btn-secondary { background: var(--green); color: white; width: 100%; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2 style="margin:0;">⚽ ThanJaiSport</h2>
        <div id="nav-user" class="hidden">
            ยินดีต้อนรับคุณ <strong id="user-name"></strong> | 
            <button onclick="ui.showSection('history')" style="background:none; color:yellow;">ประวัติสั่งซื้อ</button> |
            <button onclick="auth.logout()" style="background:red; padding:5px 10px;">ออก</button>
        </div>
    </div>

    <div id="auth-section">
        <div id="login-box" class="auth-card">
            <h2>🔒 เข้าสู่ระบบ</h2>
            <input type="text" id="l-user" placeholder="ชื่อผู้ใช้งาน">
            <input type="password" id="l-pass" placeholder="รหัสผ่าน">
            <button class="btn-primary" onclick="auth.login()">Login</button>
            <p style="font-size:14px;">ยังไม่มีบัญชี? <a href="#" onclick="ui.toggleAuth()">สมัครสมาชิก</a></p>
        </div>
        <div id="reg-box" class="auth-card hidden">
            <h2>📝 สมัครสมาชิกใหม่</h2>
            <input type="text" id="r-user" placeholder="ตั้งชื่อผู้ใช้งาน">
            <input type="password" id="r-pass" placeholder="ตั้งรหัสผ่าน">
            <button class="btn-primary" style="background:var(--green)" onclick="auth.register()">ลงทะเบียน</button>
            <p style="font-size:14px;"><a href="#" onclick="ui.toggleAuth()">กลับไปหน้าล็อกอิน</a></p>
        </div>
    </div>

    <div id="store-section" class="container hidden">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h2>👕 รายการสินค้าแนะนำ</h2>
            <button onclick="ui.showSection('history')" style="background:var(--blue); color:white;">ดูประวัติการสั่งซื้อ</button>
        </div>
        <div class="product-grid">
            <div class="product-card">
                <img src="a.jpg" alt="Home">
                <h3>เสื้อทีมชาติ (น้ำเงิน)</h3>
                <p style="color:var(--red); font-weight:bold;">790 บาท</p>
                <button class="btn-primary" onclick="shop.addToCart('เสื้อน้ำเงิน', 790)">ลงตะกร้า</button>
            </div>
            <div class="product-card">
                <img src="b.jpg" alt="Away">
                <h3>เสื้อทีมชาติ (แดง)</h3>
                <p style="color:var(--red); font-weight:bold;">890 บาท</p>
                <button class="btn-primary" onclick="shop.addToCart('เสื้อแดง', 890)">ลงตะกร้า</button>
            </div>
        </div>

        <div style="margin-top: 40px; background:#eee; padding:20px; border-radius:15px;">
            <h3>🛒 ตะกร้าสินค้าของคุณ</h3>
            <div id="cart-content">ยังไม่มีสินค้า</div>
            <hr>
            <input type="text" id="cust-addr" placeholder="ที่อยู่จัดส่งสินค้า">
            <p style="text-align:right; font-size:1.2em;">รวม: <strong id="cart-total">0</strong> บาท</p>
            <button class="btn-secondary" onclick="shop.checkout()">ยืนยันการสั่งซื้อ</button>
        </div>
    </div>

    <div id="history-section" class="container hidden">
        <button onclick="ui.showSection('store')" style="background:#666; color:white;">⬅️ กลับไปหน้าหลัก</button>
        <h2>📋 ประวัติการสั่งซื้อของคุณ</h2>
        <div id="history-content"></div>
    </div>

    <script>
        // --- ระบบจัดการ UI ---
        const ui = {
            toggleAuth: () => {
                document.getElementById('login-box').classList.toggle('hidden');
                document.getElementById('reg-box').classList.toggle('hidden');
            },
            showSection: (name) => {
                ['auth-section', 'store-section', 'history-section'].forEach(id => document.getElementById(id).classList.add('hidden'));
                document.getElementById(name + '-section').classList.remove('hidden');
                if(name === 'history') shop.renderHistory();
            }
        };

        // --- ระบบสมาชิก ---
        const auth = {
            register: () => {
                const u = document.getElementById('r-user').value;
                const p = document.getElementById('r-pass').value;
                if(!u || !p) return alert('กรุณากรอกข้อมูล');
                localStorage.setItem('user_' + u, p);
                alert('สมัครสำเร็จ!'); ui.toggleAuth();
            },
            login: () => {
                const u = document.getElementById('l-user').value;
                const p = document.getElementById('l-pass').value;
                if(localStorage.getItem('user_' + u) === p || (u==='admin' && p==='1234')) {
                    sessionStorage.setItem('current_user', u);
                    document.getElementById('user-name').innerText = u;
                    document.getElementById('nav-user').classList.remove('hidden');
                    ui.showSection('store');
                } else { alert('ชื่อหรือรหัสผ่านผิด'); }
            },
            logout: () => { sessionStorage.clear(); location.reload(); }
        };

        // --- ระบบร้านค้า ---
        const shop = {
            cart: [],
            addToCart: (name, price) => {
                shop.cart.push({name, price});
                shop.renderCart();
            },
            renderCart: () => {
                const content = document.getElementById('cart-content');
                const total = document.getElementById('cart-total');
                if(shop.cart.length === 0) { content.innerText = "ยังไม่มีสินค้า"; total.innerText = "0"; return; }
                let sum = 0;
                content.innerHTML = shop.cart.map(i => {
                    sum += i.price;
                    return `<div>🔹 ${i.name} - ${i.price} บาท</div>`;
                }).join('');
                total.innerText = sum.toLocaleString();
            },
            checkout: () => {
                const addr = document.getElementById('cust-addr').value;
                const user = sessionStorage.getItem('current_user');
                if(!addr || shop.cart.length === 0) return alert('กรุณาเลือกสินค้าและใส่ที่อยู่');

                const order = {
                    id: Date.now(),
                    user: user,
                    items: shop.cart.map(i => i.name).join(', '),
                    total: document.getElementById('cart-total').innerText,
                    addr: addr,
                    status: 'กำลังดำเนินการ',
                    date: new Date().toLocaleString()
                };

                let orders = JSON.parse(localStorage.getItem('all_orders')) || [];
                orders.push(order);
                localStorage.setItem('all_orders', JSON.stringify(orders));
                
                alert('สั่งซื้อสำเร็จ!');
                shop.cart = [];
                shop.renderCart();
                document.getElementById('cust-addr').value = "";
            },
            renderHistory: () => {
                const user = sessionStorage.getItem('current_user');
                const orders = JSON.parse(localStorage.getItem('all_orders')) || [];
                const myOrders = orders.filter(o => o.user === user);
                const content = document.getElementById('history-content');
                
                content.innerHTML = myOrders.map(o => `
                    <div class="order-item">
                        <strong>ออเดอร์ #${o.id}</strong> | วันที่: ${o.date}<br>
                        รายการ: ${o.items} | ยอดรวม: ${o.total} บาท<br>
                        สถานะ: <span style="color:blue;">${o.status}</span>
                    </div>
                `).join('') || "ยังไม่มีประวัติการสั่งซื้อ";
            }
        };
    </script>
</body>
</html>
