    <script>
        let cart = [];

        function toggleAuth() {
            document.getElementById('login-box').classList.toggle('hidden');
            document.getElementById('reg-box').classList.toggle('hidden');
        }

        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('cart-count').innerText = cart.length;
            alert('เพิ่ม ' + name + ' ลงตะกร้าแล้ว');
        }

        function openCart() {
            if(cart.length === 0) return alert('ตะกร้าว่างเปล่า');
            let listHtml = "";
            let total = 0;
            let itemNames = [];
            
            cart.forEach(item => {
                listHtml += `<p>${item.name} - ${item.price} บาท</p>`;
                total += item.price;
                itemNames.push(item.name);
            });

            document.getElementById('cart-list').innerHTML = listHtml + `<strong>รวมทั้งสิ้น: ${total} บาท</strong>`;
            document.getElementById('input-items').value = itemNames.join(', ');
            document.getElementById('input-total').value = total;
            document.getElementById('cartModal').style.display = "block";
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = "none";
        }
    </script>
